name: Prepare VPS website directory

on:
  # One-time launch trigger; removed after successful preparation.
  push:
    branches: [learn-github-actions-deploys]
    paths: [.github/workflows/prepare-vps.yml, deploy/prepare-vps.sh]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-refs/heads/main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Preserve existing HTTPS and prepare release directory
        shell: bash
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_PORT: ${{ vars.VPS_PORT || '22' }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${VPS_HOST:?Missing VPS_HOST}"
          : "${VPS_USER:?Missing VPS_USER}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing VPS_SSH_PRIVATE_KEY}"
          : "${VPS_SSH_KNOWN_HOSTS:?Missing VPS_SSH_KNOWN_HOSTS}"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$VPS_PORT" =~ ^[1-9][0-9]{0,4}$ ]] && (( VPS_PORT <= 65535 ))
          credentials=$(mktemp -d "$RUNNER_TEMP/vps-prepare.XXXXXX")
          trap 'rm -rf -- "$credentials"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          chmod 700 "$credentials"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$credentials/key"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" | tr -d '\r' > "$credentials/known_hosts"
          chmod 600 "$credentials/key" "$credentials/known_hosts"
          unset VPS_SSH_PRIVATE_KEY VPS_SSH_KNOWN_HOSTS
          ssh -F /dev/null -T -i "$credentials/key" -p "$VPS_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o IdentityAgent=none \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$credentials/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$VPS_USER@$VPS_HOST" 'bash -s' < deploy/prepare-vps.sh
